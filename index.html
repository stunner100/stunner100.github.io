<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Night Market — Vendors Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="icon" href="icon.svg"/>
<style>
:root{--gold:#e4b45a;--ink:#100c08;--card:#1a140e;--cream:#f4e6c8;--mute:#cbb892}
*{box-sizing:border-box}html,body{margin:0;background:var(--ink);color:var(--cream);font-family:Outfit,system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 500px at 10% -10%,rgba(228,180,90,.18),transparent 55%),radial-gradient(900px 420px at 90% 0,rgba(196,92,42,.16),transparent 50%),linear-gradient(180deg,#140f0a,#0c0906 45%,#120d09)}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 64px}
.hero{border:1px solid rgba(228,180,90,.2);background:#17110c/80;background:rgba(23,17,12,.8);border-radius:24px;padding:28px 24px;box-shadow:0 0 80px rgba(212,140,40,.12);position:relative}
.hero:before{content:"";display:block;height:12px;margin-bottom:16px;background-image:radial-gradient(circle at 4px 7px,#f5c56b 0 2px,transparent 2.4px),radial-gradient(circle at 18px 5px,#ffd27a 0 1.8px,transparent 2.2px);background-size:42px 12px;filter:drop-shadow(0 0 6px rgba(245,197,107,.55))}
.kicker{letter-spacing:.28em;text-transform:uppercase;font-size:11px;color:#f5c56bcc}
h1{font-family:Fraunces,serif;font-size:clamp(36px,8vw,60px);margin:8px 0 0;color:#f5d58a;line-height:1}
.sub{font-family:Fraunces,serif;font-style:italic;font-size:clamp(22px,4vw,30px);margin:8px 0 0}
.lead{max-width:36rem;color:#f4e6c8b3;margin:12px 0 0;line-height:1.5}
.stamp{margin-top:18px;display:inline-block;border:1px solid rgba(228,180,90,.25);background:#3a220f66;border-radius:16px;padding:10px 14px}
.stamp b{display:block;font-family:Fraunces,serif;font-size:22px;color:#f5d58a}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}.cols{grid-template-columns:1fr 1fr}.hero-row{display:flex;justify-content:space-between;align-items:end;gap:24px}}
.kpi,.panel,.note,.ctx{background:rgba(27,20,15,.9);border-radius:16px;padding:16px;box-shadow:inset 0 0 0 1px rgba(228,180,90,.16)}
.kpi span,.note h3,.panel h2,.ctx h3{margin:0;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:#f5c56bcc;font-weight:600}
.kpi strong{display:block;font-family:Fraunces,serif;font-size:48px;line-height:1;margin:6px 0;font-weight:500}
.kpi small,.muted{color:#f4e6c88c;font-size:12px}
.ctx{margin-top:12px;border-style:dashed}
.ctx-grid{display:grid;gap:10px;margin-top:10px}
@media(min-width:700px){.ctx-grid,.notes{grid-template-columns:1fr 1fr 1fr}.notes{grid-template-columns:1fr 1fr}}
.notes{display:grid;gap:12px;margin:16px 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:5;padding:12px 0;background:rgba(18,14,10,.85);backdrop-filter:blur(10px)}
button,input{font:inherit}button{border:1px solid rgba(228,180,90,.25);background:transparent;color:#f4e6c8cc;border-radius:999px;padding:6px 12px;cursor:pointer}button.on{background:#e4b45a;color:#1a1208}
input{flex:1;min-width:180px;background:rgba(28,21,16,.8);border:1px solid rgba(228,180,90,.2);border-radius:10px;color:#fff;padding:8px 12px}
.cols{display:grid;gap:16px}
.row{display:flex;gap:12px;background:rgba(28,21,16,.9);border-radius:12px;padding:10px 12px;margin:8px 0;box-shadow:inset 0 0 0 1px rgba(228,180,90,.1)}
.num{font-family:Fraunces,serif;width:28px;text-align:right;color:#e4b45acc;font-size:18px}
.name{font-weight:500}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;background:rgba(228,180,90,.12);color:#f5d58a}
.tag.warn{border:1px solid rgba(251,146,60,.4);background:transparent;color:#fdba74}
.empty{border:1px dashed rgba(228,180,90,.2);border-radius:12px;padding:32px;text-align:center;color:#f4e6c88c}
.chart div.track{height:10px;background:#3a220f;border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(228,180,90,.15)}
.chart div.fill{height:100%;background:linear-gradient(90deg,#d97706,#fcd34d);border-radius:999px}
.chart li{display:grid;gap:6px;margin:12px 0} @media(min-width:700px){.chart li{grid-template-columns:11rem 1fr auto;align-items:center}}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:28px;padding-top:18px;border-top:1px solid rgba(228,180,90,.15);color:#f4e6c88c;font-size:14px}
.count{background:#e4b45a;color:#1a1208;border-radius:999px;font-size:12px;padding:3px 8px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-row">
      <div>
        <p class="kicker">Accra · street food · live ops</p>
        <h1>Night Market</h1>
        <p class="sub">Vendors Live</p>
        <p class="lead" id="lead"></p>
      </div>
      <div class="stamp"><span class="kicker">As of</span><b id="asof"></b><small>Abonten Technologies</small></div>
    </div>
  </header>
  <section class="kpis" id="kpis"></section>
  <section class="ctx" id="ctx"></section>
  <section class="notes" id="notes"></section>
  <div class="bar">
    <button data-f="all" class="on">All</button>
    <button data-f="roseline">Roseline</button>
    <button data-f="ibrahim">Ibrahim</button>
    <button data-f="chains">Chains</button>
    <button data-f="overlap">Overlap</button>
    <input id="q" placeholder="Search stalls, brands, locations…" aria-label="Search vendors"/>
  </div>
  <div class="cols" id="cols"></div>
  <section class="panel chart" id="chart"></section>
  <footer>
    <p>Abonten Technologies · Night Market · Ghana</p>
    <p>Internal ops view · roster as of 27 Aug 2026</p>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
